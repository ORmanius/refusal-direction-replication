[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-direction"
version = "0.1.0"
description = "Replication of 'Refusal in Language Models Is Mediated by a Single Direction' (Arditi et al., 2024)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Roman Iliushchenko" }]
requires-python = ">=3.12"
# torch is installed separately so the CUDA / CPU build can be chosen (see README);
# the version is pinned here for the resolver.
dependencies = [
    "torch==2.14.1",
    "nnsight==0.8.2",
    "transformers==5.22.1",
    "accelerate==1.15.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
notebook = ["jupyter", "ipykernel", "nbformat", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
