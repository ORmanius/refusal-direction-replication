name: smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-pythia-70m-v1
      - name: Install CPU PyTorch
        run: pip install "torch==${{ env.TORCH_VERSION }}" --index-url https://download.pytorch.org/whl/cpu
        env:
          TORCH_VERSION: "2.14.1"
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run smoke test
        run: pytest -q
